<!doctype html>
<html lang="zh-Hant" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- 纸艺立体书版 MV 的根合成：一张全屏 canvas（Three.js 画进去）+ 一条音轨。画面全部由 src/main.js 按时间 t 绘制。
         data-duration 要等于歌曲长度（scripts/new_project.py 会按 assets/song.wav 自动改）。
         Three.js 从 lib/ 本地加载（渲染不联网），所以要有下面的 import map；单独的页面（设定图、分镜总览）也要写。 -->
    <script src="lib/gsap/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three/three.module.js",
          "three/addons/": "./lib/three/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "MVSong";
        src: local("Songti TC Bold"), local("STSongti-TC-Bold"), local("Songti SC Bold"), local("STSongti-SC-Bold");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1018;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "MVSong", serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28.0"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
      <audio
        id="song"
        class="clip"
        data-start="0"
        data-duration="28.0"
        data-track-index="2"
        data-volume="1"
        src="assets/song.wav"
      ></audio>
    </div>
    <script>
      // HyperFrames 要求根合成注册一条暂停的 GSAP 时间轴；画面不靠它，靠 src/main.js 的 hf-seek
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
