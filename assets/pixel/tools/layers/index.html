<!doctype html>
<html lang="zh-Hans" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- 分层拆解：把某一时刻拆成四格——①背景层 ②加上打好光的主体（亮层、暗层、轮廓光、描边）③发光层的泛光 ④成片。
         用法（项目根目录）：npx -y hyperframes@0.9.41 snapshot tools/layers --at 27.7 --no-end -o renders/_layers --timeout 170000 -->
    <script src="lib/gsap/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="layers" data-start="0" data-duration="300" data-width="1920" data-height="1080" data-fps="30">
      <canvas id="stage" width="1920" height="1080"></canvas>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["layers"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="layers.js"></script>
  </body>
</html>
